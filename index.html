<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUTA//CTRL — Gestión de camioneros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161A;
    --bg-elev:#1B2026;
    --bg-elev-2:#222830;
    --plate:#0D1013;
    --blue-dark:#1D4ED8;
    --blue-accent:#2563EB;
    --blue-hover:#1E40AF;
    --blue-soft:rgba(37, 99, 235, 0.15);
    --blue-dim:#3B82F6;
    --red:#E15252;
    --green:#4CAF7D;
    --text:#F3F1EA;
    --text-dim:#9AA1AB;
    --text-faint:#6B7178;
    --border:#2A323D;
    --font-display:'Barlow Condensed',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--blue-accent);color:#fff;}
  a{color:var(--blue-dim);}
  button{font-family:var(--font-body);cursor:pointer;}
  input,textarea,select{font-family:var(--font-body);}

  /* ---------- Login Screen ---------- */
  #loginScreen{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:380px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .login-box .brand-title{
    font-family:var(--font-display);font-weight:800;font-size:32px;
    color:var(--blue-dim);text-align:center;margin-bottom:6px;
  }
  .login-box .brand-title span{color:var(--text);}
  .login-box .brand-sub{
    text-align:center;color:var(--text-faint);font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;margin-bottom:24px;
  }

  /* ---------- Layout ---------- */
  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:240px;flex:none;background:var(--plate);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border);
  }
  .brand .mark{
    font-family:var(--font-display);font-weight:800;font-size:26px;
    letter-spacing:0.5px;color:var(--blue-dim);line-height:1;
  }
  .brand .mark span{color:var(--text);}
  .brand .sub{font-size:11px;color:var(--text-faint);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase;}

  .navlist{list-style:none;margin:0;padding:14px 10px;flex:1;overflow-y:auto;}
  .navlist li{margin-bottom:4px;}
  .navbtn{
    width:100%;display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:var(--text-dim);
    padding:11px 12px;border-radius:8px;font-size:14.5px;font-weight:600;
    text-align:left;transition:background .15s,color .15s;
  }
  .navbtn:hover{background:var(--bg-elev);color:var(--text);}
  .navbtn.active{background:var(--blue-dark);color:#ffffff;}
  .navbtn .ic{font-size:16px;width:18px;text-align:center;}

  .sidebar-foot{padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-faint);
    padding:8px 10px;border-radius:8px;background:var(--bg-elev);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:none;}
  .dot.ok{background:var(--green);}
  .dot.off{background:var(--red);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:24px 32px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar h1{
    font-family:var(--font-display);font-weight:700;font-size:32px;margin:0;letter-spacing:0.3px;
  }
  .topbar .subtitle{color:var(--text-dim);font-size:14px;margin-top:2px;}
  .content{padding:20px 32px 60px;flex:1;}

  /* Road-dash divider */
  .road{
    height:4px;border-radius:2px;margin:18px 0 22px;
    background:repeating-linear-gradient(90deg, var(--blue-dark) 0 22px, transparent 22px 40px);
    opacity:0.9;
  }

  .btn{
    border:1px solid var(--border);background:var(--bg-elev);color:var(--text);
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn-primary{background:var(--blue-dark);color:#ffffff;border-color:var(--blue-dark);}
  .btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}

  .grid{display:grid;gap:14px;}
  .grid-cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}

  .card{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;
  }
  .card-hover:hover{border-color:var(--blue-dim);}

  .driver-card{cursor:pointer;position:relative;}
  .driver-card .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--bg-elev-2);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--blue-dim);
    border:1px solid var(--border);margin-bottom:10px;
  }
  .driver-card h3{margin:0 0 2px;font-size:16px;font-weight:700;}
  .driver-card p{margin:0;font-size:12.5px;color:var(--text-dim);}
  .driver-card .meta{margin-top:10px;display:flex;gap:14px;}
  .driver-card .meta div{font-family:var(--font-mono);font-size:13px;color:var(--blue-dim);}
  .driver-card .meta span{display:block;font-family:var(--font-body);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;}
  
  .add-card{
    border:1.5px dashed var(--border);background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text-dim);min-height:150px;font-weight:600;font-size:13.5px;gap:8px;
  }
  .add-card:hover{border-color:var(--blue-dim);color:var(--blue-dim);}
  .add-card .plus{font-size:26px;line-height:1;}

  .section-title{
    font-family:var(--font-display);font-weight:700;font-size:20px;margin:26px 0 12px;
    display:flex;align-items:center;justify-content:space-between;
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:0.5px;padding:0 12px 8px;border-bottom:1px solid var(--border);
  }
  tbody td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:var(--bg-elev-2);}
  .num{font-family:var(--font-mono);color:var(--blue-dim);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.4px;background:var(--blue-soft);color:var(--blue-dim);
  }
  .badge-comida{background:rgba(242,183,5,.15);color:#F2B705;}
  .badge-pernocta{background:rgba(158,120,255,.15);color:#9E78FF;}

  .empty{
    padding:36px 20px;text-align:center;color:var(--text-faint);border:1px dashed var(--border);border-radius:var(--radius);
    font-size:13.5px;
  }

  .note-item{
    display:flex;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg-elev);margin-bottom:8px;align-items:flex-start;
  }
  .note-item.overdue{border-color:var(--red);}
  .note-item .chk{margin-top:2px;flex:none;width:18px;height:18px;accent-color:var(--blue-dark);cursor:pointer;}
  .note-item .body{flex:1;min-width:0;}
  .note-item h4{margin:0 0 3px;font-size:14.5px;font-weight:600;}
  .note-item.done h4{text-decoration:line-through;color:var(--text-faint);}
  .note-item p{margin:0;font-size:12.5px;color:var(--text-dim);}
  .note-item .when{font-family:var(--font-mono);font-size:11.5px;color:var(--blue-dim);margin-top:5px;}
  .note-item.overdue .when{color:var(--red);}

  .link-card{display:flex;flex-direction:column;gap:6px;}
  .link-card a{font-weight:700;font-size:14.5px;text-decoration:none;word-break:break-word;}
  .link-card a:hover{text-decoration:underline;}
  .link-card .cat{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;}
  .link-card .desc{font-size:12.5px;color:var(--text-dim);}

  /* Overlay & Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,14,.75);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .modal{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px;
  }
  .modal h2{font-family:var(--font-display);font-size:22px;margin:0 0 16px;font-weight:700;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
  .field input, .field textarea, .field select{
    width:100%;background:var(--plate);border:1px solid var(--border);color:var(--text);
    padding:10px 11px;border-radius:8px;font-size:14px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--blue-dim);}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--bg-elev-2);border:1px solid var(--border);border-left:4px solid var(--blue-dim);
    padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.35);
    max-width:320px;
  }
  .toast.error{border-left-color:var(--red);}
  .toast.success{border-left-color:var(--green);}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{
    background:var(--plate);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;min-width:140px;
  }
  .stat .v{font-family:var(--font-mono);font-size:22px;color:var(--blue-dim);font-weight:700;}
  .stat .l{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  /* Filter bar */
  .filter-bar{
    display:flex;gap:12px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;
    background:var(--bg-elev);padding:14px;border-radius:var(--radius);border:1px solid var(--border);
  }
  .filter-bar .field{margin-bottom:0;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;overflow-x:auto;}
    .brand{border-bottom:none;border-right:1px solid var(--border);white-space:nowrap;}
    .navlist{display:flex;padding:10px;overflow-x:auto;}
    .navlist li{margin-bottom:0;}
    .navbtn{white-space:nowrap;}
    .sidebar-foot{display:none;}
    .topbar,.content{padding-left:16px;padding-right:16px;}
    .field-row{grid-template-columns:1fr;}
  }

  :focus-visible{outline:2px solid var(--blue-dim);outline-offset:2px;}
</style>
</head>
<body>

<!-- ### VENTANA DE LOGIN ### -->
<div id="loginScreen">
  <div class="login-box">
    <div class="brand-title">RUTA<span>//</span>CTRL</div>
    <div class="brand-sub">Acceso Seguro</div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="loginUser" placeholder="Introduce usuario" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="Introduce contraseña" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;margin-top:8px;">Iniciar Sesión</button>
  </div>
</div>

<div id="app" style="display:none;"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ### CREDENCIALES ###
   Modifica aquí el usuario y la contraseña.
========================================================= */
const DEFAULT_AUTH = {
  user: 'Alina',
  pass: '191985'
};

/* =========================================================
   ### CONEXIÓN SUPABASE ###
========================================================= */
const SUPABASE_URL = 'https://dgfuasqbcndthqealepn.supabase.co/rest/v1/';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnZnVhc3FiY25kdGhxZWFsZXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTYzNTEsImV4cCI6MjEwMjEzMjM1MX0.mzmDnBku5Yk8UoQJrtwXfc5mBikGtvYlIqhTy55du_k';

async function supaRequest(path, opts = {}) {
  const method = opts.method || 'GET';
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
  };
  if (method !== 'GET' && method !== 'DELETE') {
    headers['Content-Type'] = 'application/json';
    headers['Prefer'] = 'return=representation';
  }

  let res;
  try {
    res = await fetch(SUPABASE_URL + path, {
      method,
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch(networkErr) {
    throw new Error('No se pudo contactar con Supabase. Revisa tu conexión a internet.');
  }

  if (!res.ok) {
    let msg = 'Error ' + res.status;
    try { 
      const j = await res.json(); 
      msg += ': ' + (j.message || j.error || JSON.stringify(j)); 
    } catch (e) {}
    throw new Error(msg);
  }

  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const api = {
  drivers: {
    list: () => supaRequest('drivers?select=*&order=created_at.desc'),
    create: (d) => supaRequest('drivers', {method:'POST', body:d}),
    update: (id, d) => supaRequest('drivers?id=eq.'+id, {method:'PATCH', body:d}),
    remove: (id) => supaRequest('drivers?id=eq.'+id, {method:'DELETE'}),
  },
  trips: {
    list: () => supaRequest('trips?select=*&order=created_at.desc'),
    create: (d) => supaRequest('trips', {method:'POST', body:d}),
    update: (id, d) => supaRequest('trips?id=eq.'+id, {method:'PATCH', body:d}),
    remove: (id) => supaRequest('trips?id=eq.'+id, {method:'DELETE'}),
  },
  rests: {
    list: () => supaRequest('rests?select=*&order=start_time.desc'),
    create: (d) => supaRequest('rests', {method:'POST', body:d}),
    update: (id, d) => supaRequest('rests?id=eq.'+id, {method:'PATCH', body:d}),
    remove: (id) => supaRequest('rests?id=eq.'+id, {method:'DELETE'}),
  },
  notes: {
    list: () => supaRequest('notes?select=*&order=reminder_at.asc.nullslast'),
    create: (d) => supaRequest('notes', {method:'POST', body:d}),
    update: (id, d) => supaRequest('notes?id=eq.'+id, {method:'PATCH', body:d}),
    remove: (id) => supaRequest('notes?id=eq.'+id, {method:'DELETE'}),
  },
  links: {
    list: () => supaRequest('links?select=*&order=created_at.desc'),
    create: (d) => supaRequest('links', {method:'POST', body:d}),
    update: (id, d) => supaRequest('links?id=eq.'+id, {method:'PATCH', body:d}),
    remove: (id) => supaRequest('links?id=eq.'+id, {method:'DELETE'}),
  },
};

/* =========================================================
   ESTADO DE LA APLICACIÓN
========================================================= */
const state = {
  tab: 'inicio',
  drivers: [],
  trips: [],
  rests: [],
  notes: [],
  links: [],
  loaded: false,
  connectionError: null,
  modal: null,
  selectedDriverId: null,
  filterFrom: '',
  filterTo: ''
};

const TABS = [
  {id:'inicio', label:'Inicio', icon:'&#127968;'},
  {id:'camioneros', label:'Camioneros', icon:'&#128100;'},
  {id:'viajes', label:'Viajes', icon:'&#128506;'},
  {id:'descansos', label:'Descansos', icon:'&#9201;'},
  {id:'notas', label:'Notas y Recordatorios', icon:'&#128221;'},
  {id:'enlaces', label:'Enlaces de interés', icon:'&#128279;'},
  {id:'perfil', label:'Detalle Camionero', hidden: true}
];

/* =========================================================
   UTILIDADES
========================================================= */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'}) + ' ' + dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function driverName(id){
  const d = state.drivers.find(x=>String(x.id)===String(id));
  return d ? d.name : '—';
}
function tripLabel(id){
  const t = state.trips.find(x=>String(x.id)===String(id));
  return t ? `${t.origin} → ${t.destination}` : '—';
}
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 4200);
}
function durationLabel(start,end){
  if(!start || !end) return '—';
  const ms = new Date(end) - new Date(start);
  if(isNaN(ms) || ms<0) return '—';
  const h = Math.floor(ms/3600000);
  const m = Math.round((ms%3600000)/60000);
  return h+'h '+m+'m';
}

function setDefaultDateFilters(){
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - 14);
  state.filterFrom = start.toISOString().split('T')[0];
  state.filterTo = end.toISOString().split('T')[0];
}

/* =========================================================
   SISTEMA DE AUTENTICACIÓN
========================================================= */
function checkAuth(){
  const isAuth = sessionStorage.getItem('rutactrl_auth');
  if(isAuth === 'true'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initApp();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
}

document.getElementById('loginBtn').addEventListener('click', performLogin);
document.getElementById('loginPass').addEventListener('keypress', (e)=>{ if(e.key==='Enter') performLogin(); });

function performLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if(u === DEFAULT_AUTH.user && p === DEFAULT_AUTH.pass){
    sessionStorage.setItem('rutactrl_auth', 'true');
    checkAuth();
  } else {
    alert('Usuario o contraseña incorrectos.');
  }
}

function logout(){
  sessionStorage.removeItem('rutactrl_auth');
  window.location.reload();
}

/* =========================================================
   CARGA DE DATOS DESDE SUPABASE
========================================================= */
async function loadAll(){
  try{
    const [drivers, trips, rests, notes, links] = await Promise.all([
      api.drivers.list(), api.trips.list(), api.rests.list(), api.notes.list(), api.links.list()
    ]);
    state.drivers = drivers || [];
    state.trips = trips || [];
    state.rests = rests || [];
    state.notes = notes || [];
    state.links = links || [];
    state.loaded = true;
    state.connectionError = null;
  }catch(e){
    state.connectionError = e.message;
    toast(e.message, 'error');
  }
  render();
}

/* =========================================================
   RENDER
========================================================= */
function render(){
  const app = document.getElementById('app');
  const visibleTabs = TABS.filter(t => !t.hidden);
  app.innerHTML = `
    <div class="sidebar">
      <div class="brand">
        <div class="mark">RUTA<span>//</span>CTRL</div>
        <div class="sub">Gestión de flota</div>
      </div>
      <ul class="navlist">
        ${visibleTabs.map(t => `
          <li>
            <button class="navbtn ${state.tab===t.id?'active':''}" data-tab="${t.id}">
              <span class="ic">${t.icon}</span>${esc(t.label)}
            </button>
          </li>`).join('')}
      </ul>
      <div class="sidebar-foot">
        <div class="status-pill">
          <span class="dot ${state.connectionError ? 'off' : (state.loaded?'ok':'')}"></span>
          ${state.connectionError ? 'Error en Supabase' : (state.loaded ? 'Conectado a BD' : 'Conectando…')}
        </div>
        <button class="btn btn-sm" id="logoutBtn" style="width:100%;justify-content:center;">Cerrar Sesión</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div>
          <h1>${esc(TABS.find(t=>t.id===state.tab).label)}</h1>
          <div class="subtitle">${topbarSubtitle()}</div>
        </div>
        ${topbarAction()}
      </div>
      <div class="road"></div>
      <div class="content" id="content">${renderContent()}</div>
    </div>
  `;
  bindNav();
  bindTabContent();
  renderModal();
}

function topbarSubtitle(){
  const map = {
    inicio:'Notas destacadas y camioneros',
    camioneros:'Alta y gestión de conductores',
    viajes:'Rutas, fechas y kilometraje',
    descansos:'Registro de descansos',
    notas:'Notas libres y recordatorios',
    enlaces:'Accesos guardados',
    perfil:'Detalle y rendimiento por fechas'
  };
  return map[state.tab] || '';
}

function topbarAction(){
  const map = {
    inicio: `<button class="btn btn-primary" data-action="new-driver">+ Nuevo camionero</button>`,
    camioneros: `<button class="btn btn-primary" data-action="new-driver">+ Nuevo camionero</button>`,
    viajes: `<button class="btn btn-primary" data-action="new-trip">+ Nuevo viaje</button>`,
    descansos: `<button class="btn btn-primary" data-action="new-rest">+ Nuevo descanso</button>`,
    notas: `<button class="btn btn-primary" data-action="new-note">+ Nueva nota</button>`,
    enlaces: `<button class="btn btn-primary" data-action="new-link">+ Nuevo enlace</button>`,
    perfil: `<button class="btn" data-action="back-drivers">&larr; Volver a camioneros</button>`
  };
  return map[state.tab] || '';
}

function bindNav(){
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ 
      state.tab = b.dataset.tab; 
      render(); 
    });
  });
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', logout);

  const topAction = document.querySelector('.topbar [data-action]');
  if(topAction){
    topAction.addEventListener('click', ()=>{
      const a = topAction.dataset.action;
      if(a==='new-driver') openModal('driver', null);
      if(a==='new-trip') openModal('trip', null);
      if(a==='new-rest') openModal('rest', null);
      if(a==='new-note') openModal('note', null);
      if(a==='new-link') openModal('link', null);
      if(a==='back-drivers') { state.tab = 'camioneros'; render(); }
    });
  }
}

function renderContent(){
  if(state.connectionError){
    return `<div class="empty">Error al sincronizar con Supabase.<br><br>
      <span style="color:var(--red);font-family:var(--font-mono);font-size:12.5px;">${esc(state.connectionError)}</span><br><br>
      <button class="btn btn-sm btn-primary" data-action="retry-load">Reintentar Conexión</button></div>`;
  }
  if(!state.loaded) return `<div class="loading">Cargando datos desde Supabase…</div>`;

  if(state.tab === 'inicio') return renderInicio();
  if(state.tab === 'camioneros') return renderCamioneros();
  if(state.tab === 'viajes') return renderViajes();
  if(state.tab === 'descansos') return renderDescansos();
  if(state.tab === 'notas') return renderNotas();
  if(state.tab === 'enlaces') return renderEnlaces();
  if(state.tab === 'perfil') return renderPerfil();
  return '';
}

function bindTabContent(){
  const retryBtn = document.querySelector('[data-action="retry-load"]');
  if(retryBtn) retryBtn.addEventListener('click', () => loadAll());

  if(state.tab === 'inicio') bindInicio();
  if(state.tab === 'camioneros') bindCamioneros();
  if(state.tab === 'viajes') bindViajes();
  if(state.tab === 'descansos') bindDescansos();
  if(state.tab === 'notas') bindNotas();
  if(state.tab === 'enlaces') bindEnlaces();
  if(state.tab === 'perfil') bindPerfil();
}

/* ---------- INICIO ---------- */
function renderInicio(){
  const pending = state.notes.filter(n=>!n.done).sort((a,b)=>{
    if(!a.reminder_at) return 1;
    if(!b.reminder_at) return -1;
    return new Date(a.reminder_at) - new Date(b.reminder_at);
  }).slice(0,6);

  return `
    <div class="section-title">Notas destacadas</div>
    ${pending.length ? pending.map(noteRowHtml).join('') : `<div class="empty">No hay notas pendientes. Crea una desde "Notas y Recordatorios".</div>`}

    <div class="section-title">Camioneros<span></span></div>
    <div class="grid grid-cards">
      ${state.drivers.map(driverCardHtml).join('')}
      <button class="card add-card" data-action="new-driver-inline">
        <span class="plus">+</span> Nuevo camionero
      </button>
    </div>
  `;
}

function driverCardHtml(d){
  const kmTotal = state.trips.filter(t=>String(t.driver_id)===String(d.id))
    .reduce((sum,t)=> sum + Number(t.km_total||0), 0);
  const restCount = state.rests.filter(r=>String(r.driver_id)===String(d.id)).length;
  return `
    <div class="card driver-card card-hover" data-view-driver="${d.id}">
      <div class="avatar">${esc(initials(d.name))}</div>
      <h3>${esc(d.name)}</h3>
      <p>${esc(d.phone||'Sin teléfono')}</p>
      <div class="meta">
        <div>${kmTotal.toLocaleString('es-ES')}<span>Km totales</span></div>
        <div>${restCount}<span>Descansos</span></div>
      </div>
    </div>
  `;
}

function noteRowHtml(n){
  const overdue = n.reminder_at && !n.done && new Date(n.reminder_at) < new Date();
  return `
    <div class="note-item ${n.done?'done':''} ${overdue?'overdue':''}" data-note="${n.id}">
      <input type="checkbox" class="chk" data-note-toggle="${n.id}" ${n.done?'checked':''}>
      <div class="body">
        <h4>${esc(n.title)}</h4>
        ${n.content ? `<p>${esc(n.content)}</p>` : ''}
        ${n.reminder_at ? `<div class="when">${fmtDateTime(n.reminder_at)}${n.driver_id?' · '+esc(driverName(n.driver_id)):''}</div>` : (n.driver_id?`<div class="when">${esc(driverName(n.driver_id))}</div>`:'')}
      </div>
    </div>
  `;
}

function bindInicio(){
  document.querySelectorAll('[data-view-driver]').forEach(el=>{
    el.addEventListener('click', ()=>{ 
      state.selectedDriverId = el.dataset.viewDriver;
      setDefaultDateFilters();
      state.tab = 'perfil'; 
      render(); 
    });
  });
  const newBtn = document.querySelector('[data-action="new-driver-inline"]');
  if(newBtn) newBtn.addEventListener('click', ()=> openModal('driver', null));
  bindNoteToggles();
}

/* ---------- CAMIONEROS ---------- */
function renderCamioneros(){
  if(!state.drivers.length) return `<div class="empty">Todavía no hay camioneros. Usa "+ Nuevo camionero" para crear el primero.</div>`;
  return `
    <div class="grid grid-cards">
      ${state.drivers.map(d => `
        <div class="card driver-card card-hover" data-view-driver="${d.id}">
          <div class="avatar">${esc(initials(d.name))}</div>
          <h3>${esc(d.name)}</h3>
          <p>${esc(d.phone||'Sin teléfono')}</p>
          ${d.notes ? `<p style="margin-top:6px;font-size:12px;color:var(--text-faint);">${esc(d.notes)}</p>` : ''}
          <div class="modal-actions" style="margin-top:12px;" onclick="event.stopPropagation()">
            <button class="btn btn-sm" data-edit-driver="${d.id}">Editar</button>
            <button class="btn btn-sm btn-danger" data-del-driver="${d.id}">Eliminar</button>

function bindCamioneros(){
  document.querySelectorAll('[data-view-driver]').forEach(el=>{
    el.addEventListener('click', ()=>{ 
      state.selectedDriverId = el.dataset.viewDriver;
      setDefaultDateFilters();
      state.tab = 'perfil'; 
      render(); 
    });
  });
  document.querySelectorAll('[data-edit-driver]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      openModal('driver', state.drivers.find(d=>String(d.id)===String(b.dataset.editDriver)));
    });
  });
  document.querySelectorAll('[data-del-driver]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('¿Eliminar este camionero?')) return;
      try{ await api.drivers.remove(b.dataset.delDriver); toast('Camionero eliminado.', 'success'); await loadAll(); }
      catch(err){ toast(err.message, 'error'); }
    });
  });
}

/* ---------- DETALLE DEL CAMIONERO (PERFIL CON FILTRO) ---------- */
function renderPerfil(){
  const driver = state.drivers.find(d=>String(d.id)===String(state.selectedDriverId));
  if(!driver) return `<div class="empty">Camionero no encontrado.</div>`;

  const fromTime = state.filterFrom ? new Date(state.filterFrom + 'T00:00:00').getTime() : 0;
  const toTime = state.filterTo ? new Date(state.filterTo + 'T23:59:59').getTime() : Infinity;

  const tripsInRange = state.trips.filter(t => {
    if(String(t.driver_id) !== String(driver.id)) return false;
    const tDate = new Date(t.start_date || t.created_at).getTime();
    return tDate >= fromTime && tDate <= toTime;
  });

  const kmPeriodo = tripsInRange.reduce((s,t)=> s + Number(t.km_total||0), 0);

  const restsInRange = state.rests.filter(r => {
    if(String(r.driver_id) !== String(driver.id)) return false;
    const rDate = new Date(r.start_time).getTime();
    return rDate >= fromTime && rDate <= toTime;
  });

  return `
    <div style="margin-bottom:20px;">
      <h2 style="font-family:var(--font-display);font-size:28px;margin:0 0 4px;">${esc(driver.name)}</h2>
      <p style="color:var(--text-dim);margin:0;">Teléfono: ${esc(driver.phone||'—')}</p>
      ${driver.notes ? `<p style="color:var(--text-faint);font-size:13px;margin:4px 0 0;">Notas: ${esc(driver.notes)}</p>` : ''}
    </div>

    <div class="filter-bar">
      <div class="field">
        <label>Desde</label>
        <input type="date" id="pFilterFrom" value="${state.filterFrom}">
      </div>
      <div class="field">
        <label>Hasta</label>
        <input type="date" id="pFilterTo" value="${state.filterTo}">
      </div>
      <button class="btn btn-primary" id="applyFilterBtn">Aplicar Filtro</button>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="v">${kmPeriodo.toLocaleString('es-ES')}</div><div class="l">Km en período</div></div>
      <div class="stat"><div class="v">${restsInRange.length}</div><div class="l">Descansos en período</div></div>
    </div>

    <div class="section-title">Descansos Registrados</div>
    ${restsInRange.length ? `
    <table>
      <thead><tr>
        <th>Tipo</th><th>Viaje Asignado</th><th>Inicio</th><th>Fin</th><th>Duración</th>
      </tr></thead>
      <tbody>
        ${restsInRange.map(r => `
          <tr>
            <td><span class="badge ${r.rest_type==='comida'?'badge-comida':(r.rest_type==='pernocta'?'badge-pernocta':'')}">${esc(r.rest_type)}</span></td>
            <td>${esc(tripLabel(r.trip_id))}</td>
            <td>${fmtDateTime(r.start_time)}</td>
            <td>${fmtDateTime(r.end_time)}</td>
            <td class="num">${durationLabel(r.start_time, r.end_time)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>` : `<div class="empty">Sin descansos en el período seleccionado.</div>`}
  `;
}

function bindPerfil(){
  const applyBtn = document.getElementById('applyFilterBtn');
  if(applyBtn){
    applyBtn.addEventListener('click', ()=>{
      state.filterFrom = document.getElementById('pFilterFrom').value;
      state.filterTo = document.getElementById('pFilterTo').value;
      render();
    });
  }
}

function bindDescansos(){
  document.querySelectorAll('[data-edit-rest]').forEach(b=>{

/* ---------- NOTAS ---------- */
function renderNotas(){
  if(!state.notes.length) return `<div class="empty">Sin notas todavía. Crea una con "+ Nueva nota".</div>`;
  const sorted = [...state.notes].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(!a.reminder_at) return 1;
    if(!b.reminder_at) return -1;
    return new Date(a.reminder_at) - new Date(b.reminder_at);
  });
  return sorted.map(n => `
    <div class="note-item ${n.done?'done':''} ${n.reminder_at && !n.done && new Date(n.reminder_at)<new Date() ? 'overdue':''}">
      <input type="checkbox" class="chk" data-note-toggle="${n.id}" ${n.done?'checked':''}>
      <div class="body">
        <h4>${esc(n.title)}</h4>
        ${n.content ? `<p>${esc(n.content)}</p>` : ''}
        <div class="when">${n.reminder_at ? fmtDateTime(n.reminder_at) : 'Sin recordatorio'}${n.driver_id?' · '+esc(driverName(n.driver_id)):''}</div>
      </div>
      <div class="row-actions">
        <button class="btn btn-sm" data-edit-note="${n.id}">Editar</button>
        <button class="btn btn-sm btn-danger" data-del-note="${n.id}">Eliminar</button>
      </div>
    </div>
  `).join('');
}

function bindNotas(){
  bindNoteToggles();
  document.querySelectorAll('[data-edit-note]').forEach(b=>{
    b.addEventListener('click', ()=> openModal('note', state.notes.find(n=>String(n.id)===String(b.dataset.editNote))));
  });
  document.querySelectorAll('[data-del-note]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar esta nota?')) return;
      try{ await api.notes.remove(b.dataset.delNote); toast('Nota eliminada.', 'success'); await loadAll(); }
      catch(e){ toast(e.message, 'error'); }
    });
  });
}

function bindNoteToggles(){
  document.querySelectorAll('[data-note-toggle]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      try{ await api.notes.update(cb.dataset.noteToggle, {done: cb.checked}); await loadAll(); }
      catch(e){ toast(e.message, 'error'); }
    });

}

function bindEnlaces(){

/* =========================================================
   MODALES
========================================================= */
function openModal(type, data){
  state.modal = {type, data: data || null};
  renderModal();
}
function closeModal(){
  state.modal = null;
  renderModal();
}
function driverOptions(selected, required=false){
  let opts = required ? `<option value="">— Seleccionar conductor —</option>` : `<option value="">— Sin asignar —</option>`;
  return opts + state.drivers.map(d=>
    `<option value="${d.id}" ${String(selected)===String(d.id)?'selected':''}>${esc(d.name)}</option>`).join('');
}
function tripOptions(selected, required=false){
  let opts = required ? `<option value="">— Seleccionar viaje —</option>` : `<option value="">— Sin viaje —</option>`;
  return opts + state.trips.map(t=>
    `<option value="${t.id}" ${String(selected)===String(t.id)?'selected':''}>${esc(t.origin)} &rarr; ${esc(t.destination)}</option>`).join('');
}
function toLocalInput(dt){
  if(!dt) return '';
  const d = new Date(dt);
  if(isNaN(d)) return '';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderModal(){
  let host = document.getElementById('modalHost');
  if(!state.modal){ if(host) host.remove(); return; }
  if(!host){ host = document.createElement('div'); host.id='modalHost'; document.body.appendChild(host); }

  const {type, data} = state.modal;
  const isEdit = !!(data && data.id);
  let inner = '';

  if(type === 'driver'){
    inner = `
      <h2>${isEdit?'Editar':'Nuevo'} camionero</h2>
      <div class="field"><label>Nombre</label><input id="f_name" value="${esc(data?.name)}"></div>
      <div class="field"><label>Teléfono</label><input id="f_phone" value="${esc(data?.phone)}"></div>
      <div class="field"><label>Notas (opcional)</label><textarea id="f_notes">${esc(data?.notes)}</textarea></div>
    `;
  }
  if(type === 'trip'){
    inner = `
      <h2>${isEdit?'Editar':'Nuevo'} viaje</h2>
      <div class="field"><label>Camionero</label><select id="f_driver">${driverOptions(data?.driver_id)}</select></div>
      <div class="field-row">
        <div class="field"><label>Origen</label><input id="f_origin" value="${esc(data?.origin)}"></div>
        <div class="field"><label>Destino</label><input id="f_destination" value="${esc(data?.destination)}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Fecha inicio</label><input type="date" id="f_start_date" value="${data?.start_date||''}"></div>
        <div class="field"><label>Fecha fin</label><input type="date" id="f_end_date" value="${data?.end_date||''}"></div>
      </div>
      <div class="field"><label>Km totales</label><input type="number" id="f_km_total" value="${data?.km_total ?? ''}"></div>
      <div class="field"><label>Notas</label><textarea id="f_notes">${esc(data?.notes)}</textarea></div>
    `;
  }
  if(type === 'rest'){
    inner = `
      <h2>${isEdit?'Editar':'Nuevo'} descanso</h2>
      <div class="field"><label>Camionero *</label><select id="f_driver">${driverOptions(data?.driver_id, true)}</select></div>
      <div class="field"><label>Viaje asociado *</label><select id="f_trip">${tripOptions(data?.trip_id, true)}</select></div>
      <div class="field"><label>Tipo de descanso</label>
        <select id="f_type">
          <option value="descanso" ${!data||data?.rest_type==='descanso'?'selected':''}>Descanso</option>
          <option value="comida" ${data?.rest_type==='comida'?'selected':''}>Comida</option>
          <option value="pernocta" ${data?.rest_type==='pernocta'?'selected':''}>Pernocta</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Hora inicio *</label><input type="datetime-local" id="f_start" value="${toLocalInput(data?.start_time)}"></div>
        <div class="field"><label>Hora fin *</label><input type="datetime-local" id="f_end" value="${toLocalInput(data?.end_time)}"></div>
      </div>
      <div class="field"><label>Notas</label><textarea id="f_notes">${esc(data?.notes)}</textarea></div>
    `;
  }
  if(type === 'note'){
    inner = `
      <h2>${isEdit?'Editar':'Nueva'} nota</h2>
      <div class="field"><label>Título</label><input id="f_title" value="${esc(data?.title)}"></div>
      <div class="field"><label>Contenido</label><textarea id="f_content">${esc(data?.content)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Recordatorio</label><input type="datetime-local" id="f_reminder" value="${toLocalInput(data?.reminder_at)}"></div>
        <div class="field"><label>Camionero (opcional)</label><select id="f_driver">${driverOptions(data?.driver_id)}</select></div>
      </div>
    `;
  }
  if(type === 'link'){
    inner = `
      <h2>${isEdit?'Editar':'Nuevo'} enlace</h2>
      <div class="field"><label>Título</label><input id="f_title" value="${esc(data?.title)}"></div>
      <div class="field"><label>URL</label><input id="f_url" value="${esc(data?.url)}" placeholder="https://"></div>
      <div class="field"><label>Categoría</label><input id="f_category" value="${esc(data?.category)}" placeholder="p.ej. Normativa, Peajes, App"></div>
      <div class="field"><label>Notas</label><textarea id="f_notes">${esc(data?.notes)}</textarea></div>
    `;
  }

  host.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        ${inner}
        <div class="modal-actions">
          ${isEdit ? `<button class="btn btn-danger" id="modalDelete">Eliminar</button>` : ''}
          <button class="btn" id="modalCancel">Cancelar</button>
          <button class="btn btn-primary" id="modalSave">Guardar</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', ()=> saveModal(type, data));
  if(isEdit){
    document.getElementById('modalDelete').addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar este registro?')) return;
      try{
        await api[type+'s'].remove(data.id);
        toast('Eliminado.', 'success');
        closeModal();
        await loadAll();
      }catch(e){ toast(e.message, 'error'); }
    });
  }
}

async function saveModal(type, data){
  const isEdit = !!(data && data.id);
  let payload = {};
  try{
    if(type === 'driver'){
      const name = document.getElementById('f_name').value.trim();
      const phone = document.getElementById('f_phone').value.trim();
      if(!name || !phone){ toast('El nombre y el teléfono son obligatorios.', 'error'); return; }
      payload = {
        name,
        phone,
        notes: document.getElementById('f_notes').value.trim() || null,
      };
    }
    if(type === 'trip'){
      const origin = document.getElementById('f_origin').value.trim();
      const destination = document.getElementById('f_destination').value.trim();
      if(!origin || !destination){ toast('Origen y destino son obligatorios.', 'error'); return; }
      payload = {
        driver_id: document.getElementById('f_driver').value || null,
        origin, destination,
        start_date: document.getElementById('f_start_date').value || null,
        end_date: document.getElementById('f_end_date').value || null,
        km_total: document.getElementById('f_km_total').value ? Number(document.getElementById('f_km_total').value) : null,
        notes: document.getElementById('f_notes').value.trim() || null,
      };
    }
    if(type === 'rest'){
      const driver_id = document.getElementById('f_driver').value;
      const trip_id = document.getElementById('f_trip').value;
      const start = document.getElementById('f_start').value;
      const end = document.getElementById('f_end').value;
      if(!driver_id || !trip_id){ toast('Debes seleccionar conductor y viaje.', 'error'); return; }
      if(!start || !end){ toast('Las horas de inicio y fin son obligatorias.', 'error'); return; }
      payload = {
        driver_id,
        trip_id,
        rest_type: document.getElementById('f_type').value,
        start_time: new Date(start).toISOString(),
        end_time: new Date(end).toISOString(),
        notes: document.getElementById('f_notes').value.trim() || null,
      };
    }
    if(type === 'note'){
      const title = document.getElementById('f_title').value.trim();
      if(!title){ toast('El título es obligatorio.', 'error'); return; }
      payload = {
        title,
        content: document.getElementById('f_content').value.trim() || null,
        reminder_at: document.getElementById('f_reminder').value ? new Date(document.getElementById('f_reminder').value).toISOString() : null,
        driver_id: document.getElementById('f_driver').value || null,
      };
    }
    if(type === 'link'){
      const title = document.getElementById('f_title').value.trim();
      const url = document.getElementById('f_url').value.trim();
      if(!title || !url){ toast('Título y URL son obligatorios.', 'error'); return; }
      payload = {
        title, url,
        category: document.getElementById('f_category').value.trim() || null,
        notes: document.getElementById('f_notes').value.trim() || null,
      };
    }

    if(isEdit) await api[type+'s'].update(data.id, payload);
    else await api[type+'s'].create(payload);

    toast(isEdit ? 'Cambios guardados.' : 'Creado correctamente.', 'success');
    closeModal();
    await loadAll();
  }catch(e){
    toast(e.message, 'error');
  }
}

/* =========================================================
   ARRANQUE
========================================================= */
function initApp(){
  loadAll();
}

checkAuth();
</script>
